# Project-scoped remote MCP references. No server process is launched locally.
[agents]
enabled = true
max_concurrent_threads_per_session = 3

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"
enabled = true

[mcp_servers.microsoft_learn]
url = "https://learn.microsoft.com/api/mcp"
enabled = true

# Optional: enable only after approved GitHub authentication and repository access.
[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp/"
http_headers = { "X-MCP-Readonly" = "true" }
enabled = false
